name: aurapms

# Local development database only. Production runs on Neon (see TECH_STACK.md
# §3); CI integration tests use Testcontainers, wired up in W1-12.

services:
  db:
    image: postgres:17-alpine
    container_name: aurapms-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: aura
      POSTGRES_PASSWORD: aura_local_dev
      POSTGRES_DB: aurapms
    ports:
      # 5433 on the host so this never collides with a Postgres already
      # listening on the default 5432.
      - '5433:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U aura -d aurapms']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  pgdata:
    name: aurapms-pgdata
